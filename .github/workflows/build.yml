# Builds the desktop installers on each platform's own runner (electron-builder builds for the host OS).
# Each job runs the unit tests first, so a broken build never ships.
name: Build installers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: "dist/*.exe"
          - os: ubuntu-latest
            artifact: "dist/*.AppImage"
          - os: macos-latest
            artifact: "dist/*.dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build installer
        run: npm run dist
        env:
          # Unsigned builds. Add signing secrets here once certificates are available (see TODO.md).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: vulnmgt-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
